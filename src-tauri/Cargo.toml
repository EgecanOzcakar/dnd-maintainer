[package]
name = "dnd-maintainer"
version = "0.1.0"
description = "D&D Keeper Desktop Application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "dnd_maintainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
